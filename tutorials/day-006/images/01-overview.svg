<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0  0 960 460" font-family="'Bradley Hand','Comic Sans MS','Chalkboard SE','Kaiti SC','KaiTi',cursive">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#4a4943" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#fffdf6"/>

  <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#3f3e38">Day 6 · 值类别：每个表达式都有身份</text>
  <text x="480" y="74" text-anchor="middle" font-size="15" fill="#7a796f">阶段 0 · 第 2 周开始 ｜ 拷贝还是移动，由它一锤定音</text>

  <!-- 第 2 周进度条 -->
  <g filter="url(#rough)">
    <rect x="45" y="94" width="155" height="56" rx="10" fill="#fbeedd" stroke="#e09552" stroke-width="3.2"/>
    <rect x="225" y="94" width="155" height="56" rx="10" fill="#f4f3ee" stroke="#a8a79c" stroke-width="2"/>
    <rect x="405" y="94" width="155" height="56" rx="10" fill="#f4f3ee" stroke="#a8a79c" stroke-width="2"/>
    <rect x="585" y="94" width="155" height="56" rx="10" fill="#f4f3ee" stroke="#a8a79c" stroke-width="2"/>
    <rect x="765" y="94" width="150" height="56" rx="10" fill="#f4f3ee" stroke="#a8a79c" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="122" y="117" font-size="13.5" font-weight="700" fill="#c07a3e">Day 6 · 今天</text>
    <text x="122" y="138" font-size="12">值类别/decltype</text>
    <text x="302" y="117" font-size="13.5">Day 7</text>
    <text x="302" y="138" font-size="12" fill="#7a796f">移动语义深入</text>
    <text x="482" y="117" font-size="13.5">Day 8</text>
    <text x="482" y="138" font-size="12" fill="#7a796f">完美转发</text>
    <text x="662" y="117" font-size="13.5">Day 9</text>
    <text x="662" y="138" font-size="12" fill="#7a796f">const/constexpr</text>
    <text x="840" y="117" font-size="13.5">Day 10</text>
    <text x="840" y="138" font-size="12" fill="#7a796f">异常安全/M0</text>
  </g>

  <!-- 值类别分类树 -->
  <g filter="url(#rough)">
    <rect x="390" y="172" width="180" height="52" rx="10" fill="#eef4fa" stroke="#5b8db8" stroke-width="2.6"/>
    <rect x="120" y="262" width="230" height="52" rx="10" fill="#eef4e8" stroke="#7fa66a" stroke-width="2.4"/>
    <rect x="610" y="262" width="230" height="52" rx="10" fill="#f9e9e5" stroke="#cf6a5a" stroke-width="2.4"/>
    <rect x="390" y="262" width="180" height="52" rx="10" fill="#fbeedd" stroke="#e09552" stroke-width="3"/>
  </g>
  <g text-anchor="middle">
    <text x="480" y="194" font-size="15" font-weight="700">表达式</text>
    <text x="480" y="214" font-size="12" fill="#7a796f">（每个表达式恰属一类）</text>
    <text x="235" y="284" font-size="14.5" font-weight="700" fill="#5c7a4e">lvalue 左值</text>
    <text x="235" y="304" font-size="12">有身份，不能被移动</text>
    <text x="480" y="284" font-size="14.5" font-weight="700" fill="#c07a3e">xvalue 将亡值</text>
    <text x="480" y="304" font-size="12">有身份，又可移动</text>
    <text x="725" y="284" font-size="14.5" font-weight="700" fill="#b3544a">prvalue 纯右值</text>
    <text x="725" y="304" font-size="12">无身份，可被移动</text>
  </g>
  <g stroke="#4a4943" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M 430 224 L 250 258"/>
    <path d="M 480 224 L 480 258"/>
    <path d="M 530 224 L 710 258"/>
  </g>
  <text x="252" y="238" font-size="12" fill="#5c897f">glvalue：有身份</text>
  <text x="660" y="238" font-size="12" fill="#8f4a3e" text-anchor="end">rvalue：可移动</text>

  <!-- 两轴说明 -->
  <g filter="url(#rough)">
    <rect x="70" y="344" width="380" height="44" rx="9" fill="#eef4e8" stroke="#7fa66a" stroke-width="2"/>
    <rect x="510" y="344" width="380" height="44" rx="9" fill="#f9e9e5" stroke="#cf6a5a" stroke-width="2"/>
  </g>
  <text x="260" y="371" text-anchor="middle" font-size="13.5" fill="#3f3e38">有身份 = 有名字/地址，能再见到它</text>
  <text x="700" y="371" text-anchor="middle" font-size="13.5" fill="#3f3e38">可移动 = 资源可以被“偷走”（Day 3 的偷指针）</text>

  <rect x="45" y="404" width="870" height="42" rx="10" fill="#eef4fa" fill-opacity="0.6" stroke="#5b8db8" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough)"/>
  <text x="480" y="431" text-anchor="middle" font-size="14.5" fill="#3f3e38">今日实测链：decltype 探针打印 10 类表达式 → 重载决议谁赢谁输 → 绑定规则让编译器亲口宣判</text>
</svg>
