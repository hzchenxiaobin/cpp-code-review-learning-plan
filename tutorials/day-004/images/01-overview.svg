  <!-- 成本对照 -->
  <g filter="url(#rough)">
    <rect x="60" y="184" width="390" height="180" rx="12" fill="#eef4e8" stroke="#7fa66a" stroke-width="2.6"/>
    <rect x="510" y="184" width="390" height="180" rx="12" fill="#fbeedd" stroke="#e09552" stroke-width="2.6"/>
  </g>
  <text x="255" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#5c7a4e">unique_ptr（昨天）</text>
  <g font-size="13.5" fill="#3f3e38">
    <text x="90" y="248">· 开销 = 裸指针（一个机器字）</text>
    <text x="90" y="276">· 拷贝：编译期禁止</text>
    <text x="90" y="304">· 所有权转移：偷指针，零分配</text>
    <text x="90" y="332" fill="#5c7a4e">→ 默认选择 ★</text>
  </g>
  <text x="705" y="216" text-anchor="middle" font-size="16.5" font-weight="700" fill="#a3663a">shared_ptr（今天）</text>
  <g font-size="13.5" fill="#3f3e38">
    <text x="540" y="248">· 控制块：强计数 + 弱计数 + 删除器</text>
    <text x="540" y="276">· 计数增减是原子操作（多线程代价）</text>
    <text x="540" y="304">· 循环引用 → 计数永不归零 → 泄漏</text>
    <text x="540" y="332" fill="#a3663a">→ 确实需要多主人时才用</text>
  </g>
  <line x1="455" y1="274" x2="505" y2="274" stroke="#4a4943" stroke-width="3" marker-end="url(#arr)"/>
  <text x="480" y="260" text-anchor="middle" font-size="12.5" fill="#7a796f">先问能否独占</text>

  <rect x="45" y="396" width="870" height="46" rx="10" fill="#eef4fa" fill-opacity="0.6" stroke="#5b8db8" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough)"/>
  <text x="480" y="425" text-anchor="middle" font-size="15" fill="#3f3e38">今日实测链：观察计数变化 → 复现循环引用（存活 = 2 无析构）→ weak_ptr 打环修复 → 观察者 / lock / shared_from_this</text>
