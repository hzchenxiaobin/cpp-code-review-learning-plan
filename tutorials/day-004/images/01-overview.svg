    </marker>
  </defs>

  <rect width="960" height="460" fill="#fffdf6"/>

  <text x="480" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#3f3e38">Day 4 · shared_ptr：共享所有权的账单</text>
  <text x="480" y="74" text-anchor="middle" font-size="15" fill="#7a796f">阶段 0 · 第 1 周 ｜ 对应《Effective Modern C++》条款 19–20</text>

